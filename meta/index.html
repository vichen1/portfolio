<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">

  <script type="module" src="../global.js"></script>
</head>
<body>

  <main>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>
    <section id="stats" class="summary-stats">
      <h2>Summary</h2>
      <dl class="stats-grid"></dl>
    </section>
    <h2>Commits by time of day</h2>
    <div id="time-controls" style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
      <label for="commit-progress">Show commits until:</label>
      <input id="commit-progress" type="range" min="0" max="100" value="100" />
      <time id="commit-time"></time>
    </div>
    <dl id="files"></dl>
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>

    <dl id="commit-tooltip" class="info tooltip hidden">
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>
    
      <dt>Date</dt>
      <dd id="commit-date"></dd>
    </dl>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
